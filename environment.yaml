# Environment for the analysis scripts.
#
#   conda env create -f environment.yaml
#   conda activate rike-evo
#
# This covers everything under 03_analysis, 02_long_read_processing, and the
# fitness-score steps 02a/02b/02c and 03 of 01_fitness_score_processing.
#
# It does NOT cover the sequencing pipeline in
# 01_fitness_score_processing/01_lrDMS_pipeline, which needs DiMSum and the raw
# reads -- see environment-pipeline.yaml for that.

name: rike-evo

channels:
  - conda-forge

dependencies:
  - python=3.10

  # Pinned: the committed figures and tables were produced with these versions,
  # and output depends on them. pandas changed the default stability of
  # sort_values and the column order of DataFrame(list_of_dicts); matplotlib
  # 3.10 autoscales 3D axes differently from the 3.5.2 that drew the published
  # panels. Unpinning these will move tie-broken orderings and 3D views.
  - numpy=2.2.6
  - pandas=2.3.3
  - matplotlib=3.10.9
  - seaborn=0.13.2
  - openpyxl=3.1.5          # pandas reads and writes the .xlsx tables through this

  # Floors only: nothing in the output depends on the exact version.
  - scipy>=1.11
  - networkx>=3.1
  - matplotlib-venn>=0.11

  # For 01_lrDMS_pipeline/02_DiMSum_DMS/2_export_all_variants.R, which reads the
  # two committed .RData files. DiMSum itself is not needed for that step.
  - r-base>=4.2
  - r-data.table

  - scikit-learn>=1.3        # EvolvePro random forests (4D), and 11_'s ROC metrics

  # Optional, for the model scoring in Figure 4D and 4E. These are heavy and want a GPU,
  # and the model weights download on first run (~2.5 GB for ESM-2 650M). The panels
  # themselves redraw from the committed tables in 4D's model_scores/ and 4E's summary,
  # so none of this is needed for a normal pass over the repo. To re-score from scratch:
  #
  #   conda install -c conda-forge pytorch
  #   pip install fair-esm transformers evcouplings
  #
  # Three methods are not pip-installable and are set up as each script's header
  # describes: MULTI-evolve (07_) and GEMME (09_) are cloned into third_party/ at the
  # repo root, GEMME also wanting GEMME_ENV pointed at a conda prefix with its own R and
  # Python dependencies. ThermoMPNN (10_) only sums a committed table and needs nothing.
  #
  # ESMC (03_) prefers EvolutionaryScale's `esm` package, which claims the same `esm`
  # import name as fair-esm and cannot share an environment with it. Either give 03_ its
  # own environment with `pip install esm`, or let it use the transformers fallback.
